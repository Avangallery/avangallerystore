<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | آوان گالری</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<div id="login" class="login"><div class="box"><div class="ag">AG</div><h1>پنل مدیریت آوان گالری</h1><p>رمز مدیریت را وارد کنید.</p><input id="pass" type="password" placeholder="رمز مدیریت"><button onclick="login()">ورود به پنل</button><i id="err"></i></div></div>
<div id="app" hidden><header><b>AVAN GALLERY — مدیریت محصولات</b><button onclick="logout()">خروج</button></header><main><section class="form"><h2 id="ft">افزودن ساعت</h2><input id="name" placeholder="نام ساعت *"><input id="price" placeholder="قیمت *"><input id="cat" value="ساعت مردانه" placeholder="دسته‌بندی"><input id="badge" placeholder="برچسب مثل: جدید / ویژه"><textarea id="desc" placeholder="توضیحات کوتاه"></textarea><label class="file">🖼️ انتخاب تصویر <input id="file" type="file" accept="image/*" onchange="upload()"></label><div id="preview"></div><label class="check"><input id="av" type="checkbox" checked> موجود است</label><div class="row"><button onclick="save()">ذخیره</button><button class="gray" onclick="reset()">انصراف</button></div><p id="msg"></p></section><section><div class="lh"><h2>محصولات ثبت‌شده</h2><button onclick="load()">بروزرسانی</button></div><div id="list"></div></section></main></div>
<script>
let editing=null,imageKey='';const $=x=>document.getElementById(x);async function api(u,o={}){let r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d}
async function check(){let d=await api('/api/me');if(d.admin){$('login').hidden=true;$('app').hidden=false;load()}}
async function login(){try{await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('pass').value})});check()}catch(e){$('err').textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function upload(){let f=$('file').files[0];if(!f)return;let d=new FormData();d.append('file',f);try{let x=await api('/api/upload',{method:'POST',body:d});imageKey=x.key;$('preview').innerHTML=`<img src="/media/${encodeURIComponent(imageKey)}">`}catch(e){$('msg').textContent=e.message}}
async function load(){let p=await api('/api/products?admin=1');$('list').innerHTML=p.map(x=>`<div class="item"><div>${x.image_key?`<img src="/media/${encodeURIComponent(x.image_key)}">`:`<span class="thumb">AG</span>`}</div><div><b>${esc(x.name)}</b><small>${esc(x.category)} • ${esc(x.price)} • ${x.available?'موجود':'ناموجود'}</small><p>${esc(x.description)}</p></div><div class="acts"><button onclick='edit(${JSON.stringify(x)})'>ویرایش</button><button class="del" onclick="del(${x.id})">حذف</button></div></div>`).join('')||'<div class="empty">هنوز محصولی ثبت نشده.</div>'}
async function save(){let b={name:$('name').value.trim(),price:$('price').value.trim(),category:$('cat').value.trim(),badge:$('badge').value.trim(),description:$('desc').value.trim(),image_key:imageKey,available:$('av').checked};try{await api(editing?'/api/products/'+editing:'/api/products',{method:editing?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});$('msg').textContent='ذخیره شد ✓';reset();load()}catch(e){$('msg').textContent=e.message}}
function edit(x){editing=x.id;imageKey=x.image_key||'';$('ft').textContent='ویرایش ساعت';$('name').value=x.name;$('price').value=x.price;$('cat').value=x.category;$('badge').value=x.badge;$('desc').value=x.description;$('av').checked=!!x.available;$('preview').innerHTML=imageKey?`<img src="/media/${encodeURIComponent(imageKey)}">`:'';scrollTo(0,0)}
async function del(id){if(confirm('محصول حذف شود؟')){await api('/api/products/'+id,{method:'DELETE'});load()}}
function reset(){editing=null;imageKey='';$('ft').textContent='افزودن ساعت';['name','price','cat','badge','desc','file'].forEach(x=>$(x).value='');$('cat').value='ساعت مردانه';$('av').checked=true;$('preview').innerHTML=''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}check();
</script></body></html>
